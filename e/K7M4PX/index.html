<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emma V3</title>
<style>body{font-family:system-ui;margin:0;background:#f7f1f4;color:#29252a}main{max-width:620px;margin:auto;padding:35px 18px 70px}.top{text-align:center}.card{background:#fff;border-radius:22px;padding:24px;margin:16px 0;box-shadow:0 4px 20px #0000000d}.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#76566f;font-weight:800}h1{font-size:36px;margin:7px}.msg{font-size:20px;line-height:1.5;white-space:pre-line}.date,.small{color:#756d75;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:14px;padding:15px;background:#efe4ea;font-weight:700}#extra{display:none;border-top:1px solid #eee;margin-top:17px;padding-top:17px}.again{width:100%;background:#76566f;color:white}@media(max-width:390px){.grid{grid-template-columns:1fr}}</style></head>
<body><main><div class="top"><div style="font-size:40px">💌</div><div class="label">A little something for</div><h1>Emma</h1><p class="small">For the good days, the ridiculous days, and the days when one work bestie look says absolutely everything.</p></div>
<div class="card"><div class="label">Your little something for today</div><p class="msg" id="daily"></p><div class="date" id="date"></div></div>
<div class="card"><h2>Need something different today?</h2><p class="small">Pick what you need. No judgement here.</p><div class="grid"><button onclick="x('work')">🫠 Work is work-ing</button><button onclick="x('laugh')">😂 Make me laugh</button><button onclick="x('worth')">❤️ Remind me who I am</button><button onclick="x('mum')">👩‍👧 Mum reminder</button></div><div id="extra"><div class="label" id="lab"></div><p class="msg" id="txt"></p><button class="again" id="again">Give me another →</button></div></div></main>
<script>
const d=[
"You're a good egg, Em. ❤️","Coffee. Kit Kat. Avoid management. In that order. ☕🍫","You're one of the very few people I feel completely comfortable being myself around. I hope you know how much I value you. ❤️","The work bestie look. 👀\nNo words required. You know exactly what I mean.","Find yourself a friend who'll always tell you the truth. Even when the truth is that you have BO. Cheers, Em. 😂","Go home. Put your comfy clothes on. Read something smut worthy. You've earned it. 🌶️📚","You're a great mum, Emma. Don't forget that on the days when you question yourself. ❤️","If today gets ridiculous, just remember: it's future meme material.","You work so hard. Just a reminder that you're allowed to switch off too. ❤️","We've reached the stage of friendship where you've seen me violently ill and I've seen you piss yourself laughing. There's really no going back now. 😂","Work is just where we happened to meet. Getting you as a friend was the good part. ❤️","May your coffee be strong, your patience stronger, and may management have absolutely no new ideas today. 😂","You're honest, loyal, thoughtful and ridiculously creative. You're genuinely a great human ❤️","Some friendships need deep conversations.\nOurs apparently needs one look across the room and an inappropriate meme.","Just in case today hasn't been particularly kind to you: you're appreciated more than you probably realise. ❤️","Today seems like an excellent day to buy another book.\nI'm an enabler, not a financial adviser. 🌶️📚","I love that we can be completely honest with each other, talk about pretty much anything and never have to pretend to be something we're not.","Today's workplace survival strategy:\nCoffee → work bestie look → meme → repeat as required.","You're one of those people who genuinely thinks about others and notices the little things. It's one of the things I really love about you. ❤️","Some people come into your life unexpectedly and end up becoming really important to you. You're one of those people for me.","If that person walks through the door today, don't worry.\nI'll already be looking at you. 👀","You don't have to have everything together all the time. You're still bloody great on the messy days too.","Friendship level:\nYou tell me when I stink.\nI know about the wee incident.\nSeems fair. 😂","You're hardworking, honest, loyal, creative and incredibly thoughtful. Basically, a bit of an overachiever making the rest of us look bad. 😂","Whatever work throws at you today, remember one very important thing:\nwe'll probably be bitching about it later anyway. 😂","You deserve good things, Emma. Not because you've worked hard enough to earn them. Just because you do. ❤️","I'm genuinely grateful that somewhere amongst all the work bullshit, I ended up finding a friend like you.","If you're reading this after a shit day, consider this your reminder that tomorrow is another day, you're loved, and there's probably chocolate nearby. 🍫❤️","Whatever kind of day you're having, just know there's always someone in your corner — even if I'm also the person sending you wildly inappropriate memes. 😂❤️\n\nLove,\nYour favourite work bestie* ❤️\n*Title declared by me. No appeals process available.","One final reminder in case you ever forget: you're a wonderful friend, a great mum and a bloody good person. I'm very lucky to have you in my life. ❤️\n\n— Your favourite work bestie\n(I've decided this on your behalf.)"];
const categories={
work:[1,3,7,8,11,13,17,20,23,24,26],
laugh:[1,3,4,5,7,9,11,13,15,17,20,22,23,24,26,27],
worth:[0,2,6,8,10,12,14,16,18,19,21,25,26,27,28,29],
mum:[6,18,21,25,29]
};
const L={work:"Work is work-ing",laugh:"Make me laugh",worth:"Remind me who I am",mum:"Mum reminder"};
let n=new Date(),start=new Date(n.getFullYear(),0,0),day=Math.floor((n-start)/86400000);document.getElementById('daily').textContent=d[((day*17)+11)%30];document.getElementById('date').textContent=n.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
let last={};
function x(c){
 let pool=categories[c], pos=Math.floor(Math.random()*pool.length);
 if(pool.length>1 && pos===last[c]) pos=(pos+1)%pool.length;
 last[c]=pos;
 let m=d[pool[pos]];
 document.getElementById('extra').style.display='block';
 document.getElementById('lab').textContent=L[c];
 document.getElementById('txt').textContent=m;
 document.getElementById('again').onclick=()=>x(c);
}
</script></body></html>
