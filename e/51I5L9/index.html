<style>

</style></head><body><main><div class=k>40 little bits for 40 years</div><h1>Sarah</h1><div class=sub>a little something, just for you ♡</div><div class=stars>✦ · ✧ · ✦</div><div class="envelope-wrap"><div id="env" class="envelope"><div class="env-back"></div><div class="letter"></div><div class="env-flap"></div><div class="env-pocket"></div><div class="env-pocket-heart">♥</div></div></div><div id=g></div><div id=gs></div><button id=b>REVEAL TODAY'S BIT</button><div id=card></div><div class=dots><i style="background:var(--pink)"></i><i style="background:var(--lav)"></i><i style="background:var(--blue)"></i><i style="background:var(--sage)"></i><i style="background:var(--peach)"></i></div><div class=sig>love your guts ♡</div><div class=brand>the meaningful bit</div></main>
<script>
const M=["Love your guts. ❤️", "You've been cuddling me since we were kids.\nSome things I'm very happy haven't changed. ❤️", "You're strong, clever, beautiful, funny, intimidating and exceptionally well caffeinated.\nA very solid combination.", "From sharing a bedroom and you doing my makeup… to being actual adults with families and lives of our own.\nSo weird. 😂❤️", "Coffee first.\nThis message understands its place in the hierarchy. ☕", "Your house has always been somewhere I can walk into and immediately feel comfortable. Good food, animals, coffee, laughs and one of my favourite people. ❤️", "You give the best hugs.\nI don't know what your technique is, but please don't change it.", "Imagine telling little us, sharing a bedroom, that one day people would ask if we were twins and we'd actually laugh about it. 😂", "Remember when you sectioned off our shared bedroom so I couldn't touch your side?\n\nAnd I had to climb over the bunk bed and slide down just to get around it.\n\nHonestly, living with you required parkour. 😂", "You don't need to have everything figured out.\n\nYou've handled every version of life that's come before this one.\nYou'll handle the next one too. ❤️", "One of the best things about having you as my sister is knowing I can ask you for advice and you'll actually tell me what you think.\n\nAnd more often than not, it's exactly what I needed to hear. ❤️", "You've raised two amazing humans and you're a great mum.\nJust in case you needed the reminder today. ❤️", "Today's important reminder:\nEat the good food.\nLife is too short for disappointing snacks.", "I love watching you be an aunty to my girls.\nWe're all incredibly lucky to have you in our lives. ❤️", "Middle child energy.\nStrong opinions. Good advice. Slightly intimidating.\n\nI'm not saying there's a connection… 😂", "Three years older than me.\n\nWhich means you've always been available to test-drive adulthood first.\n\nThank you for your service. 😂", "You are beautiful, Sarah. And I don't just mean the annoying actually-pretty kind.\n\nYou're beautiful in the way you love people, welcome them in and make them feel comfortable too. ❤️", "Today's forecast:\n100% chance you'll need coffee and snacks. ☕\n\nBeyond that, you're on your own.", "Somewhere between sharing a room and building completely separate lives, you became more than just my sister.\n\nYou're genuinely one of my favourite people and one of my best friends. ❤️", "Having an adult and an almost-adult child means you've officially reached the stage where they can start giving you unsolicited life advice.\n\nEnjoy. 😂", "Working dogs, raising children, training hard, cooking great food and giving excellent advice…\n\nHonestly, it's getting a little excessive.\n\nLeave some skills for the rest of us. 😂", "40.\nStill hot.\nStill funny.\nStill slightly intimidating.\n\nCarry on.", "Things Sarah considers perfectly normal:\n\nPutting the kettle back in the cupboard.\n\nWith water still in it.\n\nI'm still processing this. 😂", "You don't need to prove anything to anyone.\n\nKeep doing life your way.\nIt suits you. ❤️", "Just imagine how many coffees you've consumed in 40 years.\n\nActually, don't.\n\nThere are probably financial implications. ☕😂", "Growing up with you meant sharing a room, makeup lessons, advice, laughs and having someone to look up to without really realising that's what I was doing.\n\nI got pretty lucky with my big sister. ❤️", "Today's profound wisdom:\n\nFarts are still funny.\n\nThank you for attending.", "One of the things I admire most about you is that you keep growing. You try new things, challenge yourself and don't seem particularly interested in standing still.\n\nI hope you're always like that. ❤️", "Reminder:\nYou are never too old to get ridiculously excited about something completely unnecessary.\n\nI fully support it.", "If your coffee machine ever dies, please know that I'll be there for you during this incredibly difficult time.\n\nThoughts and prayers. ☕🙏", "You make seriously good food.\n\nGoing to your house hungry is always a very good decision. 😂", "Today's wellness advice:\n\nDrink water.\nEat something good.\nMove your body.\n\nThen have a coffee because we have shit to do. ☕", "There are people you love because they're family, and then there are family members you'd genuinely choose as people too.\n\nI'd choose you. ❤️", "Coffee. Animals. Good food. Family. Training.\n\nHonestly, your hierarchy of needs is pretty solid.", "Runs City2Surf.\n\nCrosses the finish line holding hands with her brother and sister.\n\nVery Sarah. ❤️", "Do more of what makes you feel like you. ❤️", "If today isn't going to plan, I recommend coffee, food and lowering your expectations of everyone around you.\n\nYou're welcome. ☕😂", "Here's to taking more photos, making more memories and eventually looking back at them wondering what the hell we were wearing. 😂❤️", "Whatever stage of life we're in, however much changes and however old we get, you'll always be my big sister.\n\nAnd I'll always be incredibly grateful that you are. ❤️", "Happy 40th, Sarah.\n\nYou're funny, clever, strong, beautiful inside and out, an incredible mum and aunty, and the kind of sister I genuinely couldn't imagine doing life without.\n\nFrom sharing a bedroom and you doing my makeup, to raising our own families and apparently becoming twins somewhere along the way — I'm so lucky I got to grow up with you.\n\nAnd I'm even luckier I still get to have you beside me for everything that comes next.\n\nLove your guts. Always. ❤️"],G=[["Well hello, you legend. ☕", "There's a little something waiting for you."], ["Look who finally scanned the mug. 😂", "There's a little something waiting for you."], ["Hello, gorgeous. Coffee first, obviously. ☕", "There's a little something waiting for you."], ["Well, well, well. Look who needs another little bit.", "There's a little something waiting for you."], ["Oh good, you've got coffee. ☕", "We can begin."]],R=["Welcome back, you function key(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const n=new Date(), birthday=n.getMonth()===11&&n.getDate()===14, idx=birthday?39:hash("Sarah|"+key(n))%39;
const gr=Math.random()<.10?R:G[Math.floor(Math.random()*G.length)];
document.getElementById("g").textContent=gr[0];document.getElementById("gs").textContent=gr[1];
